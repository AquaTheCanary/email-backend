<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-8 max-w-md w-full">
        
        <!-- Step 1: Email First -->
        <div id="step-email" class="space-y-5">
            <h2 class="text-3xl font-bold text-white">Welcome!</h2>
            <p class="text-slate-400">Let's get you going. Enter your email address to begin setup.</p>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Email Address</label>
                <input type="email" id="email-input" placeholder="you@example.com" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white placeholder-slate-500">
            </div>
            <p id="email-error" class="text-red-400 text-sm hidden bg-red-950/50 border border-red-800 p-3 rounded-lg leading-relaxed"></p>
            <button onclick="sendVerificationCode()" id="send-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition duration-200">Send Verification Code</button>
        </div>

        <!-- Step 2: Verification Code -->
        <div id="step-verify" class="space-y-5 hidden">
            <h2 class="text-3xl font-bold text-white">Check Your Email</h2>
            <p class="text-slate-400">We sent a 6-digit verification code to <span id="sent-email-display" class="text-indigo-400 font-semibold break-all"></span>.</p>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">6-Digit Code</label>
                <input type="text" id="code-input" maxlength="6" placeholder="123456" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-center tracking-widest text-2xl font-mono text-white placeholder-slate-500">
            </div>
            <p id="code-error" class="text-red-400 text-sm hidden bg-red-950/50 border border-red-800 p-3 rounded-lg leading-relaxed"></p>
            <button onclick="verifyCode()" class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition duration-200">Verify Email</button>
        </div>

        <!-- Step 3: Name -->
        <div id="step-name" class="space-y-5 hidden">
            <h2 class="text-3xl font-bold text-white">Email Verified!</h2>
            <p class="text-slate-400">Step 1<br><span class="text-lg font-medium text-slate-200">What is your name?</span></p>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Your Name</label>
                <input type="text" id="name-input" placeholder="Archie" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white placeholder-slate-500">
            </div>
            <button onclick="submitName()" class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition duration-200">Continue</button>
        </div>

        <!-- Step 4: Age Check -->
        <div id="step-age" class="space-y-5 hidden">
            <h2 class="text-3xl font-bold text-white">Step 2</h2>
            <p id="age-greeting" class="text-slate-200 text-lg font-medium"></p>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">How old are you?</label>
                <input type="number" id="age-input" placeholder="18" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white placeholder-slate-500">
            </div>
            <p id="age-error" class="text-red-400 text-sm hidden bg-red-950/50 border border-red-800 p-3 rounded-lg leading-relaxed"></p>
            <button onclick="submitAge()" class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition duration-200">Complete Setup</button>
        </div>

    </div>

    <script>
        // Set to your Vercel backend URL (Do NOT include a trailing slash /)
        const VERCEL_API_URL = "https://email-backend-gamma.vercel.app";

        let userEmail = "";
        let userName = "";
        let expectedCode = "";

        function showStep(stepId) {
            ['step-email', 'step-verify', 'step-name', 'step-age'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(stepId).classList.remove('hidden');
        }

        async function sendVerificationCode() {
            userEmail = document.getElementById('email-input').value.trim();
            const errorEl = document.getElementById('email-error');
            const btn = document.getElementById('send-btn');

            if (!userEmail.includes('@') || !userEmail.includes('.')) {
                errorEl.innerText = "Please enter a valid email address.";
                errorEl.classList.remove('hidden');
                return;
            }

            errorEl.classList.add('hidden');
            btn.innerText = "Sending Email...";
            btn.disabled = true;

            try {
                const response = await fetch(`${VERCEL_API_URL}/api/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail })
                });

                const rawText = await response.text();
                let result;
                
                try {
                    result = JSON.parse(rawText);
                } catch (e) {
                    throw new Error(`Server Error (${response.status}): ${rawText.slice(0, 120)}...`);
                }

                if (response.ok && result.success) {
                    expectedCode = result.code;
                    document.getElementById('sent-email-display').innerText = userEmail;
                    showStep('step-verify');
                } else {
                    errorEl.innerText = result.error || result.message || `Failed to send email (Status ${response.status}).`;
                    errorEl.classList.remove('hidden');
                }
            } catch (err) {
                errorEl.innerText = err.message || "Failed to connect to backend.";
                errorEl.classList.remove('hidden');
            } finally {
                btn.innerText = "Send Verification Code";
                btn.disabled = false;
            }
        }

        function verifyCode() {
            const enteredCode = document.getElementById('code-input').value.trim();
            const errorEl = document.getElementById('code-error');

            if (enteredCode === expectedCode) {
                errorEl.classList.add('hidden');
                showStep('step-name');
            } else {
                errorEl.innerText = "Incorrect verification code. Please check your email and try again.";
                errorEl.classList.remove('hidden');
            }
        }

        function submitName() {
            userName = document.getElementById('name-input').value.trim();
            if (!userName) return;

            document.getElementById('age-greeting').innerText = `OK, ${userName}, let's give you the right experience. How old are you?`;
            showStep('step-age');
        }

        function submitAge() {
            const age = parseInt(document.getElementById('age-input').value);
            const errorEl = document.getElementById('age-error');

            if (isNaN(age)) {
                errorEl.innerText = "Please enter a valid number for your age.";
                errorEl.classList.remove('hidden');
                return;
            }

            if (age < 18) {
                errorEl.innerText = `Sorry, ${userName}, you need to be at least 18 years old to register for this.`;
                errorEl.classList.remove('hidden');
            } else {
                // Success - Redirect to Google
                window.location.href = "https://www.google.com";
            }
        }
    </script>
</body>
</html>
